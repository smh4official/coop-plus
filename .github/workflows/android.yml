name: SM64coop+ Android Build

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget

      - name: Download source ZIP
        run: |
          wget -O source.zip \
            "https://drive.usercontent.google.com/download?id=17J-u4SqVzfsrSGe1c4_qLyo4fLbXH4Qk&export=download"

      - name: Extract source
        run: |
          mkdir source
          unzip -q source.zip -d source

      - name: Show project structure
        run: |
          echo "=== Top level ==="
          find source -maxdepth 2 -type f | sort | head -200

          echo "=== Android build files ==="
          find source -type f \( \
            -name 'Android.make' -o \
            -name 'Android.mk' -o \
            -name 'build.gradle' -o \
            -name 'settings.gradle' -o \
            -name 'gradlew' -o \
            -name 'Dockerfile' \
          \) -print | sort
